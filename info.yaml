  uo[4]: "gpio4"
  uo[5]: "gpio5"
  uo[6]: "gpio6"
  uo[7]: "gpio7"

  uio[0]: "gpio0"
  uio[1]: "gpio1"
  uio[2]: "gpio2"
  uio[3]: "gpio3"
  uio[4]: "gpio4"
