name: gds

on:
  # Only harden when RTL/config changes — workflow/test/docs edits must not
  # cancel a multi-hour LibreLane job.
  push:
    paths:
      - 'src/**'
      - 'info.yaml'
  workflow_dispatch:

# One GDS at a time — parallel LibreLane jobs starve each other on free runners.
concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ciel PDK fetch often hits httpx.ReadTimeout on cold runners; retry the
      # whole TT harden action a few times before giving up.
      - name: Build GDS
        uses: Wandalen/wretry.action@v3.8.0
        with:
          attempt_limit: 3
          attempt_delay: 60000
          action: TinyTapeout/tt-gds-action@ttsky26d
          with: |
            pdk: sky130A


  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Gate-level netlist is plain Verilog; Icarus is enough and avoids the
      # cocotb↔Verilator version dance that broke this job previously.
      - name: Install Icarus Verilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: GL test
        env:
          SIM: icarus
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    # Pages must be enabled in repo Settings → Pages (source: GitHub Actions).
    # Do not fail the whole workflow if Pages is not configured yet.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
