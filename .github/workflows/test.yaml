name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Ubuntu 24.04 apt ships Verilator 5.020; cocotb 2.1 needs >= 5.036.
      - name: Install Verilator 5.036
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            iverilog git help2man perl python3 make autoconf g++ flex bison \
            libfl2 libfl-dev zlib1g-dev ccache
          git clone --depth 1 --branch v5.036 https://github.com/verilator/verilator.git
          cd verilator
          autoconf
          ./configure --prefix="${HOME}/verilator-v5.036"
          make -j"$(nproc)"
          make install
          echo "${HOME}/verilator-v5.036/bin" >> "${GITHUB_PATH}"
          "${HOME}/verilator-v5.036/bin/verilator" --version

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
